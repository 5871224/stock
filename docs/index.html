<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="匯出負庫存清單，並標記訂單報表中的缺貨商品。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>負庫存 Excel 轉檔</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      color: #172d35;
      background: #edf3f4;
      line-height: 1.6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 45rem; margin: clamp(2rem, 9vw, 6rem) auto; padding-inline: 1.25rem; }
    h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.25; }
    section { background: #fff; border: 1px solid #d2e0e3; border-radius: 1rem; box-shadow: 0 16px 50px #18343f0d; padding: clamp(1.15rem, 4vw, 2rem); }
    section + section { margin-top: 1rem; }
    .drop-hint { margin: .75rem 0 1rem; color: #415a63; font-size: .9rem; }
    #drop-status { margin: 0 0 1rem; }
    body.is-dragging section { outline: 2px dashed #0d6157; outline-offset: 3px; background: #f1faf8; }
    body.is-dragging .drop-hint { color: #0d6157; font-weight: 700; }
    label { display: block; font-weight: 700; margin-bottom: .5rem; }
    input {
      display: block;
      width: 100%;
      padding: .65rem;
      font: inherit;
      font-size: .9375rem;
      background: #f5f8f9;
      border: 1px solid #b8cbd0;
      border-radius: .6rem;
    }
    input::file-selector-button {
      margin-inline-end: .75rem;
      padding: .52rem .75rem;
      border: 1px solid #b8cbd0;
      border-radius: .35rem;
      background: #fff;
      color: #172d35;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    .status { margin: 1rem 0 0; color: #415a63; overflow-wrap: anywhere; }
    .status[data-error] { color: #ac3029; }
    .shortage-list { margin-top: .75rem; overflow-x: auto; }
    .shortage-list table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .shortage-list caption { text-align: left; font-weight: 700; margin-bottom: .35rem; }
    #shortage-count { margin-inline-start: .4rem; font-weight: 400; color: #415a63; }
    .shortage-list th, .shortage-list td { padding: .4rem .5rem; border-bottom: 1px solid #d2e0e3; text-align: left; }
    .shortage-list th { background: #f5f8f9; white-space: nowrap; }
    .shortage-list th:nth-child(n+3), .shortage-list td:nth-child(n+3) { text-align: right; font-variant-numeric: tabular-nums; }
    .shortage-list td:last-child { color: #ac3029; font-weight: 700; }
    .download { display: inline-block; margin-top: .75rem; padding: .65rem 1.05rem; border-radius: .5rem; background: #0d6157; color: #fff; font-weight: 700; text-decoration: none; }
    .download:hover { background: #094940; }
    :focus-visible { outline: 3px solid #1a766d; outline-offset: 3px; }
    [hidden] { display: none !important; }
  </style>
  <script src="./vendor/jszip.min.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <h1>負庫存 Excel 轉檔</h1>
    <p class="drop-hint">可將商品列表、訂單報表拖曳到網頁任意位置，自動辨識檔案類型。</p>
    <p id="drop-status" class="status" role="status" hidden></p>
    <section aria-label="商品列表轉檔">
      <label for="product-file">商品列表（.xlsx）</label>
      <input id="product-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      <p id="status" class="status" role="status">選擇商品列表後即可下載結果。</p>
      <a id="download" class="download" hidden>下載 Excel</a>
      <noscript><p>請啟用 JavaScript 以使用轉檔功能。</p></noscript>
    </section>
    <section aria-label="訂單報表標記">
      <label for="report-file">訂單報表（.xlsx）</label>
      <input id="report-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-describedby="report-status">
      <p id="report-status" class="status" role="status">可先選擇商品列表或訂單報表。</p>
      <a id="report-download" class="download" hidden>下載標綠訂單報表</a>
      <div id="shortage-list" class="shortage-list" hidden>
        <table>
          <caption>訂單數量不足 <span id="shortage-count"></span></caption>
          <thead><tr><th scope="col">SKU</th><th scope="col">商品款式</th><th scope="col">需求數量</th><th scope="col">訂單數量</th><th scope="col">不足數量</th></tr></thead>
          <tbody id="shortage-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
